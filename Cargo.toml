[package]
name = "meaty_ore"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
include = ["/assets/**"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.18.1", features = ["bevy_dev_tools"] }
rand = "0.9.4"


# Enable a small amount of optimization in debug mode.
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (Including Bevy)
[profile.dev.package."*"]
opt-level = 3

# Enable high optimizations for release builds.
[features]
debug = []